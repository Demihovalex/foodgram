volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ashotvartan/foodgram_backend:latest
    env_file: .env
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: ashotvartan/foodgram_gateway:latest
    ports:
      - "9000:80"
    volumes:
      - static:/staticfiles
      - media:/media
      - ./frontend/build:/usr/share/nginx/html
    depends_on:
      - backend

server {
    server_tokens off;
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /media/ {
        alias /media/;
    }

    location /static/admin/ {
        alias /staticfiles/admin/;
        expires 30d;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
    }

    location /api/users/ {
        proxy_pass http://backend:8000/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/set_password/ {
        proxy_pass http://backend:8000/api/auth/users/set_password/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/subscriptions/ {
        proxy_pass http://backend:8000/api/users/subscriptions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/token/login/ {
        proxy_pass http://backend:8000/api/auth/token/login/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}

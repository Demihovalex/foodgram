server {
    server_tokens off;
    listen 80;
    server_name _;

    location /media/ {
        alias /media/;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://frontend:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8000;
        proxy_set_header Host $host;
    }
}
